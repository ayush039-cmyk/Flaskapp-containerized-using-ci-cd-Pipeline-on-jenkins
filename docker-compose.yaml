version : "3"
services:
  flaskapp:
    image: dockerayush039/flaskapp
    ports:
      - "5000:5000"
    environment:
       FLASK_ENV: production
       MYSQL_HOST: mysql
       MYSQL_ROOT_USER: root
       MYSQL_ROOT_PASSWORD: root
       MYSQL_DATABASE: Gym
       MYSQL_CURSORCLASS: DictCursor
    depends_on:
      - mysql
  
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
       MYSQL_ROOT_USER: root
       MYSQL_ROOT_PASSWORD: root
       MYSQL_DATABASE: Gym
    volumes:
      - mysql_data:/var/lib/mysql
      - ./gym.sql:/docker-entrypoint-initdb.d/gym.sql

volumes:
  mysql_data:
